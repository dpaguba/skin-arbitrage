[project]
name = "skin-arbitrage"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "pynacl>=1.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "multidict>=6.0", "yarl>=1.9"]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p aiohttp.pytest_plugin"
